spring.application.name=reydereyes

# ---------------------------------------------------------------------------
# Base de datos LOCAL (PostgreSQL instalado en la PC del local).
# Los datos de conexion vienen de variables de entorno; nunca se escriben aca.
# ---------------------------------------------------------------------------
spring.datasource.url=${REYDEREYES_DB_URL:jdbc:postgresql://localhost:5432/reydereyes}
spring.datasource.username=${REYDEREYES_DB_USUARIO:reydereyes}
spring.datasource.password=${REYDEREYES_DB_CLAVE:}

# El esquema lo crean y actualizan las migraciones de Flyway (db/migration).
# Hibernate solo verifica que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hora argentina para la base y para el frontend
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# ---------------------------------------------------------------------------
# Servidor: solo accesible desde la misma PC. La sesion del duenio dura todo el dia.
# ---------------------------------------------------------------------------
server.address=${REYDEREYES_DIRECCION:127.0.0.1}
server.port=${REYDEREYES_PUERTO:8080}
server.servlet.session.timeout=24h
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# Usuario unico (se crea la primera vez que arranca)
app.duenio.usuario=${REYDEREYES_DUENIO_USUARIO:duenio}
app.duenio.clave=${REYDEREYES_DUENIO_CLAVE:}
app.duenio.nombre=${REYDEREYES_DUENIO_NOMBRE:Duenio}

# ---------------------------------------------------------------------------
# Sincronizacion con Supabase. Usa el rol restringido sync_local por el pooler
# (modo sesion, puerto 5432). Ver docs/PUESTA-EN-MARCHA.md.
# ---------------------------------------------------------------------------
app.sync.habilitada=${SUPABASE_SYNC_HABILITADA:false}
app.sync.url=${SUPABASE_DB_URL:}
app.sync.usuario=${SUPABASE_SYNC_USUARIO:}
app.sync.clave=${SUPABASE_SYNC_CLAVE:}
app.sync.intervalo=PT5M
app.sync.lote=200
app.sync.alerta-sin-subir=PT1H

# ---------------------------------------------------------------------------
# Copias de seguridad con pg_dump (opcionales). Las URL son de libpq, por ejemplo
# postgresql://localhost:5432/reydereyes
# ---------------------------------------------------------------------------
app.respaldo.pg-dump=${REYDEREYES_PG_DUMP:pg_dump}
app.respaldo.carpeta=${REYDEREYES_CARPETA_COPIAS:}
app.respaldo.local-url=${REYDEREYES_DB_URL_LIBPQ:}
app.respaldo.nube-url=${SUPABASE_BACKUP_URL:}
app.respaldo.nube-clave=${SUPABASE_BACKUP_CLAVE:}
app.respaldo.conservar=30

# Mensajes de error legibles para las pantallas
server.error.include-message=always
